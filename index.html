<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshay R. Dudhwala</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            max-width: 700px;
            background: #161b22;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #58a6ff, #f0883e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            font-size: 1.1rem;
            color: #8b949e;
            margin: 10px 0 20px;
        }
        .bio {
            font-size: 1rem;
            line-height: 1.7;
            color: #c9d1d9;
            margin-bottom: 25px;
        }
        .links a {
            display: inline-block;
            margin: 8px 12px;
            padding: 10px 22px;
            background: #21262d;
            color: #58a6ff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            border: 1px solid #30363d;
            transition: 0.3s;
        }
        .links a:hover {
            background: #30363d;
            border-color: #58a6ff;
            transform: scale(1.04);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Akshay R. Dudhwala</h1>
        <p class="tagline">🚀 AI Enthusiast · Developer · Explorer</p>
        <div class="bio">
            <p>
                नमस्ते! मैं Akshay हूँ — एक उत्सुक इंसान जो AI, Web Development, 
                और नई-नई टेक्नोलॉजी सीखने का शौक रखता है। 
                इस पेज पर आपका स्वागत है! 🙏
            </p>
        </div>
        <div class="links">
            <a href="https://github.com/akkiridder" target="_blank">🐙 GitHub</a>
            <a href="https://linkedin.com/in/yourprofile" target="_blank">🔗 LinkedIn</a>
            <a href="mailto:your-email@example.com">📧 Email</a>
        </div>
        <div class="footer">
            ✨ Built with ❤️ — Hosted on GitHub Pages
        </div>
    </div>
</body>
</html>
